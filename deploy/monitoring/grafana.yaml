apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitoring-grafana
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-grafana
spec:
  selector:
    app: monitoring-grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring-grafana
  template:
    metadata:
      labels:
        app: monitoring-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: monitoring-grafana-credentials, key: admin-password}
            - name: WORKBENCH_DB_USER
              valueFrom:
                secretKeyRef: {name: monitoring-grafana-credentials, key: db-user}
            - name: WORKBENCH_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: monitoring-grafana-credentials, key: db-password}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: monitoring-grafana}
        - name: datasources
          configMap: {name: monitoring-grafana-datasources}
        - name: providers
          configMap: {name: monitoring-grafana-providers}
        - name: dashboards
          configMap: {name: monitoring-grafana-dashboards}
