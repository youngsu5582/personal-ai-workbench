apiVersion: v1
kind: Service
metadata:
  name: workbench-management
spec:
  selector:
    app.kubernetes.io/name: workbench
  ports:
    - name: management
      port: 8081
      targetPort: management
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-prometheus-node-metrics
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-prometheus-node-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-prometheus-node-metrics
subjects:
  - kind: ServiceAccount
    name: monitoring-prometheus
    namespace: workbench
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitoring-prometheus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-prometheus
spec:
  selector:
    app: monitoring-prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring-prometheus
  template:
    metadata:
      labels:
        app: monitoring-prometheus
    spec:
      serviceAccountName: monitoring-prometheus
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=8GB
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: monitoring-prometheus-config}
        - name: data
          persistentVolumeClaim: {claimName: monitoring-prometheus}
