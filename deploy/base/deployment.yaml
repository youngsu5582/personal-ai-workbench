apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workbench
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbench
    spec:
      serviceAccountName: workbench
      securityContext:
        runAsNonRoot: true
        # 볼륨 파일의 그룹을 앱 사용자(이미지의 uid · gid 10001)로 둔다. 서명 키를 0440 으로 붙여도 앱이 읽는다.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # 인가 서버가 토큰에 서명하는 RSA 개인키(PEM). 운영자가 서버에서 만든 Secret 이다 — 만드는 법은 deploy/README.md 의 Secret 절.
        # 없으면 Pod 가 뜨지 않는다. 앱도 키 없이는 기동하지 않으므로 먼저 멈추는 쪽이 낫다.
        - name: authserver-signing-key
          secret:
            secretName: workbench-authserver-signing-key
            defaultMode: 0440
      containers:
        - name: workbench
          image: ghcr.io/youngsu5582/personal-ai-workbench:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - secretRef:
                name: workbench-runtime
          # AUTH_SIGNING_KEY 가 이 위치의 파일을 가리킨다(runtime.env.example).
          volumeMounts:
            - name: authserver-signing-key
              mountPath: /etc/workbench/keys
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
