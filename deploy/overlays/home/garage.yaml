apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: rpc
      port: 3901
      targetPort: rpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  serviceName: garage
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      initContainers:
        - name: render-config
          image: busybox:1.36.1
          command: ["sh", "-c"]
          args:
            - >-
              set -eu;
              secret="$(cat /var/run/garage-secret/RPC_SECRET)";
              sed "s|__RPC_SECRET__|${secret}|" /template/garage.toml.template > /config/garage.toml
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: rendered-config
              mountPath: /config
            - name: garage-secret
              mountPath: /var/run/garage-secret
              readOnly: true
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          # 이미지에 셸도, PATH 위의 실행 파일도 없다. 바이너리는 루트의 /garage 하나다.
          command: ["/garage"]
          args: ["server"]
          env:
            # 서버와 kubectl exec 로 부르는 CLI 가 같은 설정을 읽게 한다. 기본 경로(/etc/garage.toml)에는 파일이 없다.
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: rendered-config
              mountPath: /etc/garage
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-template
          configMap:
            name: garage-config
        - name: rendered-config
          emptyDir: {}
        - name: garage-secret
          secret:
            secretName: garage-credentials
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Gi
