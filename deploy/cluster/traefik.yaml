# k3s 가 함께 띄우는 Traefik 의 설정을 덮는다. k3s 를 --disable=traefik 없이 띄워야 이 설정이 쓰인다.
# 이 객체는 kube-system 에 있어야 해서, workbench 네임스페이스로 묶인 overlay 와 따로 apply 한다.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # 클러스터 안에서만 연다. 바깥에서 오는 길은 cloudflared 하나다.
    # 차트(40.x)는 Service 종류를 service.spec 아래에서 읽는다. service.type 은 모르는 키라 무시된다.
    service:
      spec:
        type: ClusterIP
    ports:
      web:
        # cloudflared(클러스터 Pod 대역)가 넘긴 X-Forwarded-* 를 믿는다.
        # 믿지 않으면 Traefik 이 Proto 를 http 로 덮어, 앱이 OAuth redirect_uri 를 http 로 만든다.
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
