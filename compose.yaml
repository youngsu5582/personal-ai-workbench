services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-ai-workbench-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_ai_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench}
    ports:
      - "5433:5432"
    volumes:
      - personal-ai-workbench-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal-ai-workbench-postgres:
