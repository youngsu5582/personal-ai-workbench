spring.application.name=personal-ai-workbench

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/personal_ai_workbench}
spring.datasource.username=${DB_USERNAME:workbench}
spring.datasource.password=${DB_PASSWORD:workbench}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.dev.joyson.aiworkbench=${LOG_LEVEL_APP:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
