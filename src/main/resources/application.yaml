spring:
  application:
    name: personal-ai-workbench

  # 비밀은 .env 에서 읽는다. 이 파일은 커밋되지 않는다.
  # 실제 환경변수가 있으면 그쪽이 우선하므로 배포에서는 .env 없이 주입해도 된다.
  config:
    import: "optional:file:.env[.properties]"

  # ── 아래 값들에는 기본값을 두지 않는다 ──────────────────────────────
  # 기본값을 두면 배포에서 환경변수를 빠뜨렸을 때 조용히 로컬 설정으로 뜬다.
  # 없으면 기동에 실패하는 편이 낫다. 로컬 값은 application-local.yaml 이 채운다.
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. Hibernate 는 확인만 한다.
      #
      # 환경변수로 뚫어두지 않는다. 뚫어두면 "이번 한 번만" 이 배포에서 스키마를 바꾸는 길이 되고,
      # 그렇게 바뀐 스키마는 db/migration 어디에도 남지 않는다.
      ddl-auto: validate
    open-in-view: false

  # 스키마는 db/migration 이 정한다. 엔티티는 그것을 검증받는 쪽이다.
  flyway:
    # 이미 스키마가 있는 DB 는 V1 을 다시 돌리지 않고 그 지점에서 시작한다.
    # ddl-auto 로 만들어져 굴러가던 DB 를 옮겨 태우기 위한 것이고, 새 DB 에는 영향이 없다.
    baseline-on-migrate: true
    baseline-version: 1

  security:
    oauth2:
      client:
        registration:
          # registration id 'google' 이 Spring 의 CommonOAuth2Provider.GOOGLE 과 이름으로 매칭된다.
          # 그래서 authorization-uri·token-uri·jwk-set-uri·issuer-uri 를 여기 적지 않아도 된다.
          # 이 이름은 /oauth2/authorization/{id} 와 /login/oauth2/code/{id} 의 {id} 이기도 하다.
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope:
              - openid
              - profile
              - email

# 내가 발급하는 토큰 설정. Google 의 issuer 와 다른 것이다 — 이건 내 서비스다.
workbench:
  auth:
    issuer: "${AUTH_ISSUER}"
    audience: "${AUTH_AUDIENCE:workbench-api}"
    # 기본값이 없다. 있으면 저장소에 공개된 키로 서명하게 된다.
    jwt-secret: "${AUTH_JWT_SECRET}"
    access-token-ttl: "${AUTH_ACCESS_TOKEN_TTL:15m}"
    # 기본은 HTTPS 전용. 평문으로 내보내는 쪽이 예외여야 한다.
    cookie-secure: "${AUTH_COOKIE_SECURE:true}"
    # 비워두면 누구나 로그인된다. 외부에 노출한다면 반드시 채운다.
    allowed-emails: "${AUTH_ALLOWED_EMAILS:}"

  storage:
    # 이름이 곧 FileStorageFactory 의 빈 이름이다. 오타·빈 값은 기동에서 잡힌다.
    provider: "${STORAGE_PROVIDER:local}"
    # 발급한 다운로드 주소의 수명. 서명이 인증을 대신하므로 이 값이 곧 유출 시 피해 범위다.
    # 보관소가 서명할 수 있을 때만 쓰인다 — 로컬 디스크는 바이트를 직접 내보낸다.
    presigned-url-ttl: "${STORAGE_PRESIGNED_URL_TTL:5m}"
    local:
      root: "${STORAGE_LOCAL_ROOT:./var/assets}"
    # provider 가 s3 일 때만 읽힌다. bucket 이 비어 있으면 기동에 실패한다.
    s3:
      bucket: "${STORAGE_S3_BUCKET:}"
      region: "${STORAGE_S3_REGION:us-east-1}"
      # MinIO·R2 를 가리킬 때만 채운다. 비우면 AWS 로 간다.
      endpoint: "${STORAGE_S3_ENDPOINT:}"
      # 비우면 SDK 기본 탐색(환경변수·인스턴스 역할)에 맡긴다.
      access-key: "${STORAGE_S3_ACCESS_KEY:}"
      secret-key: "${STORAGE_S3_SECRET_KEY:}"
      path-style-access: "${STORAGE_S3_PATH_STYLE_ACCESS:false}"

  provider:
    # 이 키만 다른 값들과 규칙이 다르다 — 비어 있어도 기동에 실패하지 않는다.
    # 대신 OpenAI Provider 빈이 만들어지지 않아 `ProviderRegistry` 에서도 사라진다.
    # OpenAI 를 쓰지 않는 환경이 정상이기 때문이다.
    openai:
      api-key: "${WORKBENCH_PROVIDER_OPENAI_API_KEY:}"

logging:
  level:
    root: "${LOG_LEVEL_ROOT:INFO}"
    dev.joyson.aiworkbench: "${LOG_LEVEL_APP:INFO}"
  pattern:
    # %clr() 이 색을 만든다. 이걸 빼면(= 기본 패턴을 직접 덮어쓰면) 색이 전부 사라진다.
    # 색 적용 여부는 spring.output.ansi.enabled 가 따로 결정한다(기본 DETECT).
    # %wEx 는 스택트레이스를 보기 좋게 접어주는 Boot 전용 변환어다.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level){} %clr([%thread]){faint} %clr(%logger{36}){cyan} %clr(-){faint} %m%n%wEx"
