spring:
  application:
    name: personal-ai-workbench

  # 프로젝트 루트의 .env 를 설정으로 읽어들인다 (KEY=VALUE 라 properties 문법과 호환된다).
  # 이게 없으면 bootRun·IntelliJ 어느 쪽도 .env 를 보지 않아서
  # GOOGLE_CLIENT_ID 가 아래 기본값(local-dev-client-id)인 채로 뜨고 Google 이 invalid_client 를 준다.
  # optional: 이라 파일이 없어도 기동은 된다. 실제 환경변수가 있으면 그쪽이 우선한다.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/personal_ai_workbench}"
    username: "${DB_USERNAME:workbench}"
    password: "${DB_PASSWORD:workbench}"

  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:update}"
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          # registration id 'google' 이 Spring 의 CommonOAuth2Provider.GOOGLE 과 이름으로 매칭된다.
          # 그래서 authorization-uri·token-uri·jwk-set-uri·issuer-uri 를 여기 적지 않아도 된다.
          # 이 이름은 /oauth2/authorization/{id} 와 /login/oauth2/code/{id} 의 {id} 이기도 하다.
          #
          # Google Cloud Console > Google Auth Platform > Clients 에서 발급한다.
          # 승인된 리디렉션 URI 에 아래를 정확히 등록한다:
          #   http://localhost:8080/login/oauth2/code/google
          google:
            client-id: "${GOOGLE_CLIENT_ID:local-dev-client-id}"
            client-secret: "${GOOGLE_CLIENT_SECRET:local-dev-client-secret}"
            scope:
              - openid
              - profile
              - email

# 내가 발급하는 토큰 설정. Google 의 issuer 와 다른 것이다 — 이건 내 서비스다.
workbench:
  auth:
    issuer: "${AUTH_ISSUER:https://workbench.local}"
    audience: "${AUTH_AUDIENCE:workbench-api}"
    jwt-secret: "${AUTH_JWT_SECRET:local-development-secret-please-change-me-32b}"
    access-token-ttl: "${AUTH_ACCESS_TOKEN_TTL:15m}"
    cookie-secure: "${AUTH_COOKIE_SECURE:false}"
    # 비워두면 누구나 로그인된다. 외부에 노출한다면 반드시 채운다.
    allowed-emails: "${AUTH_ALLOWED_EMAILS:}"

logging:
  level:
    root: "${LOG_LEVEL_ROOT:INFO}"
    dev.joyson.aiworkbench: "${LOG_LEVEL_APP:DEBUG}"
  pattern:
    # %clr() 이 색을 만든다. 이걸 빼면(= 기본 패턴을 직접 덮어쓰면) 색이 전부 사라진다.
    # 색 적용 여부는 spring.output.ansi.enabled 가 따로 결정한다(기본 DETECT).
    # %wEx 는 스택트레이스를 보기 좋게 접어주는 Boot 전용 변환어다.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level){} %clr([%thread]){faint} %clr(%logger{36}){cyan} %clr(-){faint} %m%n%wEx"
