spring:
  datasource:
    url: "jdbc:h2:mem:workbench-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  security:
    oauth2:
      client:
        registration:
          # oauth2Login 을 구성하려면 ClientRegistrationRepository 빈이 반드시 있어야 한다.
          # 이 더미 값이 없으면 애플리케이션 컨텍스트 자체가 뜨지 않는다.
          # 실제 구글 호출은 하지 않는다.
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email

workbench:
  auth:
    issuer: "https://workbench.test"
    audience: workbench-api
    jwt-secret: "test-secret-key-for-hs256-at-least-32-bytes"
    access-token-ttl: 15m

logging:
  level:
    root: WARN
    dev.joyson.aiworkbench: INFO
