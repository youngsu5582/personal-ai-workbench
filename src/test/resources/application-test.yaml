spring:
  datasource:
    url: "jdbc:h2:mem:workbench-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  # 마이그레이션은 PostgreSQL 문법으로 쓰여 있어 H2 에서 돌지 않는다.
  # 대부분의 테스트는 엔티티에서 만든 스키마로 충분하고, 마이그레이션 자체는
  # SchemaMigrationTest 가 진짜 PostgreSQL 에 걸어본다.
  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          # oauth2Login 을 구성하려면 ClientRegistrationRepository 빈이 반드시 있어야 한다.
          # 이 더미 값이 없으면 애플리케이션 컨텍스트 자체가 뜨지 않는다.
          # 실제 구글 호출은 하지 않는다.
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email

workbench:
  generation:
    worker:
      # 테스트가 도는 동안 폴러가 끼어들면 Task 상태가 테스트 몰래 바뀐다.
      enabled: false
  auth:
    issuer: "https://workbench.test"
    audience: workbench-api
    jwt-secret: "test-secret-key-for-hs256-at-least-32-bytes"
    access-token-ttl: 15m

logging:
  level:
    root: WARN
    dev.joyson.aiworkbench: INFO
