# 테스트가 쓰는 설정 **전부**. application.yaml 을 덮는 파일이 아니다.
#
# 이름은 프로필 덮어쓰기처럼 생겼지만, build.gradle.kts 가 `spring.config.name` 을 이 이름으로
# 바꿔 두어서 Boot 는 이 파일 하나만 읽는다. application.yaml 은 읽지 않는다 —
# 거기 있는 `spring.config.import: file:.env` 가 테스트에 개발 DB 주소와 실제 API 키를
# 끌고 들어오기 때문이다.
#
# 그래서 공통 설정을 application.yaml 에 추가하면 **여기에도 같이 넣어야** 테스트가 본다.

spring:
  datasource:
    # 진짜 주소는 PostgresTestDatabase 가 컨테이너를 띄워 시스템 프로퍼티로 넣는다.
    # 시스템 프로퍼티가 이 값을 이기므로 평소에는 이 줄이 쓰이지 않는다.
    #
    # 그런데도 적어두는 이유는 **안전장치**다. 이 줄이 없으면 application.yaml 의
    # `${DB_URL}` 로 흘러가 .env 가 가리키는 **개발 DB** 에 붙고, 테스트의 create-drop 이
    # 거기서 돈다. 실제로 한 번 테이블을 날렸다. 못 붙는 주소를 박아두면 그때 시끄럽게 실패한다.
    url: "jdbc:invalid://tests-must-use-the-container"
    username: none
    password: none

  # @DataJpaTest 는 기본적으로 datasource 를 내장 DB 로 바꿔치기한다. 그러면 컨테이너를 띄운 의미가 없다.
  test:
    database:
      replace: none

  jpa:
    hibernate:
      ddl-auto: create-drop

  # 스키마는 엔티티에서 만든다. 마이그레이션 자체는 SchemaMigrationTest 가 따로 검증한다 —
  # 여기서 Flyway 를 켜면 컨텍스트마다 스키마를 다시 만들 수 없어 테스트 간에 데이터가 섞인다.
  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          # oauth2Login 을 구성하려면 ClientRegistrationRepository 빈이 반드시 있어야 한다.
          # 이 더미 값이 없으면 애플리케이션 컨텍스트 자체가 뜨지 않는다.
          # 실제 구글 호출은 하지 않는다.
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email

workbench:
  generation:
    worker:
      # 테스트가 도는 동안 폴러가 끼어들면 Task 상태가 테스트 몰래 바뀐다.
      enabled: false
  auth:
    issuer: "https://workbench.test"
    audience: workbench-api
    jwt-secret: "test-secret-key-for-hs256-at-least-32-bytes"
    access-token-ttl: 15m

logging:
  level:
    root: WARN
    dev.joyson.aiworkbench: INFO
