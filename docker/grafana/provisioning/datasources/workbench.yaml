apiVersion: 1

# uid 를 고정한다. 대시보드가 데이터소스를 uid 로 가리키므로, 바뀌면 패널이 모두 끊긴다.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # 쌓인 Task 처럼 DB 에만 있는 사실은 앱 지표로 내보내지 않고 여기서 SQL 로 본다.
  # 호스트 포트로 간다 — 개발 DB 는 다른 워크트리의 compose 에서 떠 있을 수도 있어 서비스 이름으로는 못 닿는다.
  # 로컬 개발 DB 라 앱과 같은 계정을 쓴다. Grafana 의 SQL 은 쓰기도 되므로 운영에서는 읽기 전용 계정을 따로 둔다.
  - name: Workbench DB
    uid: workbench-db
    type: grafana-postgresql-datasource
    url: host.docker.internal:5433
    user: $WORKBENCH_DB_USER
    jsonData:
      database: $WORKBENCH_DB_NAME
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $WORKBENCH_DB_PASSWORD
