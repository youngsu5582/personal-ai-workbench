name: deploy-pr

# v 로 시작하는 태그를 밀면, 그 커밋의 이미지로 홈서버 overlay 의 digest 를 바꾸는 PR 과 Release 를 만든다.
# 클러스터에는 닿지 않는다 — 홈서버는 밖에서 들어갈 수 없어, 머지 뒤 apply 는 홈서버에서 사람이 한다(deploy/README.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  deploy-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # 배포 브랜치 push 와 Release
      pull-requests: write  # 배포 PR
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 떠 있는 커밋부터 태그까지의 이력을 읽는다

      - uses: docker/setup-buildx-action@v3

      # 이미지는 main 에 들어간 커밋만 있다. 브랜치 커밋에 붙인 태그는 여기서 멈춘다.
      - name: 태그가 main 의 커밋인지 확인
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$TAG 는 main 에 없는 커밋이다. main 에 머지된 커밋에 태그를 붙인다."
            exit 1
          }

      # 배포 브랜치는 main 에서 딴다. 태그 뒤에 main 이 더 나아갔어도 PR 의 차이는 digest 한 줄이다.
      - name: digest 를 바꾸고 PR 본문을 만든다
        run: |
          git switch -c "deploy/$TAG" origin/main
          .claude/scripts/deploy-pr.sh "$GITHUB_SHA" "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/notes.md"

      - name: PR 과 Release 를 만든다
        run: |
          title="chore(deploy): 홈서버 이미지를 $TAG(${GITHUB_SHA:0:7}) 로 올린다"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "$title"
          git push -q origin "deploy/$TAG"
          gh pr create --base main --head "deploy/$TAG" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
