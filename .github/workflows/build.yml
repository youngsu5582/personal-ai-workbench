name: build

# main 으로 가는 변경은 전부 여기를 통과해야 한다.
on:
  pull_request:
  push:
    branches: [main]

# PR 에 새 커밋이 오면 돌고 있던 것은 버린다 — 결과를 아무도 안 본다.
# main 은 취소하지 않는다. "이 커밋이 초록이었다" 는 기록이라 남겨야 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 빌드와 테스트는 읽기만 하면 된다. 명시하지 않으면 저장소 기본값을 따르는데,
# 공개 저장소에서 서드파티 액션을 쓰는 이상 줄여두는 편이 낫다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Testcontainers 가 이미지를 못 받거나 컨테이너가 안 뜨면 기본값 6시간을 그대로 태운다.
    # 로컬에서 전체 테스트가 20초 안쪽이라 이 정도면 충분히 여유가 있다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # 의존성과 빌드 결과를 캐시한다. 설정 파일이 바뀌면 알아서 새로 받는다.
      - uses: gradle/actions/setup-gradle@v4

      # 테스트가 Testcontainers 로 PostgreSQL 을 띄운다. ubuntu-latest 러너에는 Docker 가 있다.
      - run: ./gradlew build --no-daemon

      # 실패했을 때 어느 테스트가 왜 깨졌는지 보려면 리포트가 필요하다.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
